name: MaMusique
options:
  bundleIdPrefix: fr.mamusique
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MaMusique:
    type: application
    platform: iOS
    sources:
      - MusicApp.swift
      - Player.swift
      - Store.swift
      - Views.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.mamusique.app
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Ma Musique
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
