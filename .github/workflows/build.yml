name: Construire l'IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Installer XcodeGen
        run: brew install xcodegen
      - name: Générer le projet Xcode
        run: xcodegen generate
      - name: Compiler (sans signature)
        run: |
          set -o pipefail
          xcodebuild -project MaMusique.xcodeproj -scheme MaMusique \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log
      - name: Afficher les erreurs
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -30
      - name: Créer le fichier .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MaMusique.app Payload/
          zip -qr MaMusique.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MaMusique-ipa
          path: MaMusique.ipa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: journal-erreurs
          path: build.log
