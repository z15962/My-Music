name: Construire l'IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Installer XcodeGen
        run: brew install xcodegen
      - name: Générer le projet Xcode
        run: xcodegen generate
      - name: Compiler (sans signature)
        run: |
          xcodebuild -project MaMusique.xcodeproj -scheme MaMusique \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build.log 2>&1 || { echo "=== ERREURS ==="; grep -E "error:" build.log | sort -u | head -30; exit 1; }
      - name: Créer le fichier .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MaMusique.app Payload/
          zip -qr MaMusique.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MaMusique-ipa
          path: MaMusique.ipa
